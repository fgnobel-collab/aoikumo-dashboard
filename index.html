const s = (style) => style;

function KPICard({ label, value, sub, color, icon }) {
  return React.createElement("div", { style: s({
    background:"#0f172a", border:`1px solid ${color}33`, borderRadius:16,
    padding:"20px 24px", display:"flex", flexDirection:"column", gap:6,
    position:"relative", overflow:"hidden"
  })},
    React.createElement("div", { style:{ position:"absolute", top:0, right:0, width:80, height:80, background:`${color}11`, borderRadius:"0 16px 0 80px" }}),
    React.createElement("div", { style:{ fontSize:24 }}, icon),
    React.createElement("div", { style:{ color:"#94a3b8", fontSize:12, letterSpacing:"0.05em", textTransform:"uppercase" }}, label),
    React.createElement("div", { style:{ color, fontSize:32, fontWeight:800, fontFamily:"'Space Grotesk',sans-serif", lineHeight:1 }}, value),
    sub && React.createElement("div", { style:{ color:"#64748b", fontSize:11 }}, sub)
  );
}

function Modal({ initialData, onSave, onClose, currentPeriod, t, lang }) {
  const td = (text) => lang === 'en' ? (dataDict[text] || text) : text;
  
  // จัดการ Type
  let initType = "Aesthetic (ความงาม)";
  let initCustomType = "";
  if (initialData) {
    if (TYPES.slice(0, -1).includes(initialData.type)) initType = initialData.type;
    else { initType = "Others"; initCustomType = initialData.type !== "Others" ? initialData.type : ""; }
  }

  // จัดการ Source
  let initSource = "ไม่ระบุ";
  let initCustomSource = "";
  if (initialData) {
    if (SOURCES.slice(0, -1).includes(initialData.source)) initSource = initialData.source;
    else { initSource = "Others"; initCustomSource = initialData.source !== "Others" ? initialData.source : ""; }
  }

  const [form, setForm] = useState(initialData ? 
    { ...initialData, type: initType, customType: initCustomType, source: initSource, customSource: initCustomSource } : 
    { name:"", type:"Aesthetic (ความงาม)", customType:"", package:"ไม่ระบุ", source:"ไม่ระบุ", customSource:"", stage:"Prospect", value:"", prob:0, priority:"กลาง", month: currentPeriod, note:"" }
  );
  
  const handleChange = (k, v) => {
    setForm(f => {
      const newForm = { ...f, [k]: v };
      if (k === 'type') {
        newForm.package = "ไม่ระบุ";
        if (v !== 'Others') newForm.customType = ""; 
      }
      if (k === 'source' && v !== 'Others') newForm.customSource = "";
      if (k === 'stage' && v === 'ปิดดีลแล้ว') newForm.prob = 100;
      return newForm;
    });
  };

  const inputStyle = { background:"#1e293b", border:"1px solid #334155", borderRadius:8, padding:"8px 12px", color:"#f8fafc", fontSize:14, outline:"none", width:"100%" };
  const isEditing = !!initialData;

  return React.createElement("div", { style:{ position:"fixed", inset:0, background:"#000000cc", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center", padding: "20px" }},
    React.createElement("div", { className: "modal-scroll", style:{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:20, padding:32, width:460, maxHeight: "90vh", overflowY: "auto", display:"flex", flexDirection:"column", gap:14 }},
      React.createElement("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" }},
        React.createElement("div", { style:{ color:"#f8fafc", fontWeight:700, fontSize:18, fontFamily:"'Space Grotesk',sans-serif" }}, isEditing ? t("modalEdit") : t("modalAdd")),
        React.createElement("button", { onClick:onClose, style:{ background:"none", border:"none", color:"#64748b", fontSize:20, cursor:"pointer" }}, "✕")
      ),
      // ข้อมูลพื้นฐาน
      ...[
        { label: t("thName"), key:"name", type:"text" },
        { label: t("lblValue"), key:"value", type:"number" },
        { label: t("lblProb"), key:"prob", type:"number" },
      ].map(({ label, key, type }) =>
        React.createElement("div", { key, style:{ display:"flex", flexDirection:"column", gap:6 }},
          React.createElement("label", { style:{ color:"#94a3b8", fontSize:12 }}, label),
          React.createElement("input", { type, value:form[key], onChange:e=>handleChange(key,e.target.value), style:inputStyle })
        )
      ),
      // ข้อมูลแบบ Dropdown 1
      ...[
        { label: t("lblMonth"), key:"month", opts: FORM_PERIODS },
        { label: t("lblType"), key:"type", opts:TYPES },
      ].map(({ label, key, opts }) =>
        React.createElement("div", { key, style:{ display:"flex", flexDirection:"column", gap:6 }},
          React.createElement("label", { style:{ color:"#94a3b8", fontSize:12 }}, label),
          React.createElement("select", { value:form[key], onChange:e=>handleChange(key,e.target.value), style:inputStyle },
            ...opts.map(o => React.createElement("option", { key:o, value:o }, td(o)))
          ),
          (key === 'type' && form.type === 'Others') && React.createElement("input", {
            type: "text", placeholder: t("plhCustomType"), value: form.customType, onChange: e => handleChange("customType", e.target.value),
            style: { ...inputStyle, marginTop: 4, borderColor: "#60a5fa" }
          })
        )
      ),
      // แพ็กเกจ
      React.createElement("div", { style:{ display:"flex", flexDirection:"column", gap:6 }},
        React.createElement("label", { style:{ color:"#94a3b8", fontSize:12 }}, t("lblPackage")),
        React.createElement("select", { value:form.package, onChange:e=>handleChange('package',e.target.value), style:inputStyle },
          ...(PACKAGE_MAP[form.type] || ALL_PACKAGES).map(o => React.createElement("option", { key:o, value:o }, td(o)))
        )
      ),

      React.createElement("div", { style:{ display:"flex", flexDirection:"column", gap:6 }},

          ...SOURCES.map(o => React.createElement("option", { key:o, value:o }, td(o)))
        ),
        (form.source === 'Others') && React.createElement("input", {
          type: "text", placeholder: t("plhCustomSource"), value: form.customSource, onChange: e => handleChange("customSource", e.target.value),
          style: { ...inputStyle, marginTop: 4, borderColor: "#60a5fa" }
        })

      // ข้อมูลแบบ Dropdown 2
      ...[
        { label: t("lblStage"), key:"stage", opts:STAGES },
        { label: t("lblPriority"), key:"priority", opts:["สูง","กลาง","ต่ำ"] },
