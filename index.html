<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aoikumo Sales Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #020617; color: #f8fafc; font-family: 'Sarabun', sans-serif; }
    select, input, button { font-family: 'Sarabun', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    table { border-collapse: collapse; width: 100%; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect } = React;
const { PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

const PERIODS = [
  "มกราคม 2569", "กุมภาพันธ์ 2569", "มีนาคม 2569", "เมษายน 2569",
  "พฤษภาคม 2569", "มิถุนายน 2569", "กรกฎาคม 2569", "สิงหาคม 2569",
  "กันยายน 2569", "ตุลาคม 2569", "พฤศจิกายน 2569", "ธันวาคม 2569"
];

const TYPES = [
  "Aesthetic (ความงาม)",
  "General Clinic (คลินิกทั่วไป)",
  "Wellness / กายภาพ",
  "Dental (ทำฟัน)",
  "Vet (รักษาสัตว์)",
  "Hair (ดูแลเส้นผม)",
  "Others"
];

// จัดกลุ่ม Package ตามประเภทคลินิก
const PACKAGE_MAP = {
  "Aesthetic (ความงาม)": ["ไม่ระบุ", "Grow", "Aesthetics", "Medical Aesthetics"],
  "General Clinic (คลินิกทั่วไป)": ["ไม่ระบุ", "GP", "GP +"],
  "Wellness / กายภาพ": ["ไม่ระบุ", "Wellness"],
  "Dental (ทำฟัน)": ["ไม่ระบุ", "Dental Lite", "Dental", "Dental +"],
  "Vet (รักษาสัตว์)": ["ไม่ระบุ", "kumoVet", "kumoVet GROOM", "kumoVet PLUS"],
  "Hair (ดูแลเส้นผม)": ["ไม่ระบุ", "Hair", "Hair PLUS"],
  "Others": ["ไม่ระบุ"]
};

const INITIAL_DATA = [
  { id: 1, name: "คลินิกที่กำลังจะปิด", type: "Aesthetic (ความงาม)", package: "Medical Aesthetics", stage: "รอเซ็นสัญญา", value: 48000, prob: 90, priority: "สูง", month: "พฤษภาคม 2569" },
  { id: 2, name: "คลินิก Demo วันจันทร์", type: "Aesthetic (ความงาม)", package: "Aesthetics", stage: "Demo แล้ว", value: 36000, prob: 60, priority: "สูง", month: "พฤษภาคม 2569" },
  { id: 3, name: "คลินิก A", type: "General Clinic (คลินิกทั่วไป)", package: "GP", stage: "Interested", value: 24000, prob: 30, priority: "กลาง", month: "พฤษภาคม 2569" },
  { id: 4, name: "คลินิก B", type: "Wellness / กายภาพ", package: "Wellness", stage: "Prospect", value: 0, prob: 10, priority: "ต่ำ", month: "พฤษภาคม 2569" },
  { id: 5, name: "คลินิก C", type: "Aesthetic (ความงาม)", package: "Grow", stage: "Follow Up", value: 36000, prob: 40, priority: "กลาง", month: "พฤษภาคม 2569" },
];

const STAGES = ["Prospect","Interested","Follow Up","นัด Demo","Demo แล้ว","รอเซ็นสัญญา","ปิดดีลแล้ว","ไม่สนใจ"];

const STAGE_COLORS = {
  "Prospect":"#94a3b8","Interested":"#60a5fa","Follow Up":"#f59e0b",
  "นัด Demo":"#a78bfa","Demo แล้ว":"#34d399","รอเซ็นสัญญา":"#f97316",
  "ปิดดีลแล้ว":"#10b981","ไม่สนใจ":"#ef4444"
};

const TYPE_COLORS = {
  "Aesthetic (ความงาม)":"#e879f9",
  "General Clinic (คลินิกทั่วไป)":"#38bdf8",
  "Wellness / กายภาพ":"#4ade80",
  "Dental (ทำฟัน)":"#fb923c",
  "Vet (รักษาสัตว์)":"#facc15",
  "Hair (ดูแลเส้นผม)":"#818cf8",
  "Others":"#94a3b8"
};

const PRIORITY_BADGE = {
  "สูง":{ bg:"#fee2e2", text:"#dc2626" },
  "กลาง":{ bg:"#fef9c3", text:"#b45309" },
  "ต่ำ":{ bg:"#dcfce7", text:"#166534" }
};

const s = (style) => style;

function KPICard({ label, value, sub, color, icon }) {
  return React.createElement("div", { style: s({
    background:"#0f172a", border:`1px solid ${color}33`, borderRadius:16,
    padding:"20px 24px", display:"flex", flexDirection:"column", gap:6,
    position:"relative", overflow:"hidden"
  })},
    React.createElement("div", { style:{ position:"absolute", top:0, right:0, width:80, height:80, background:`${color}11`, borderRadius:"0 16px 0 80px" }}),
    React.createElement("div", { style:{ fontSize:24 }}, icon),
    React.createElement("div", { style:{ color:"#94a3b8", fontSize:12, letterSpacing:"0.05em", textTransform:"uppercase" }}, label),
    React.createElement("div", { style:{ color, fontSize:32, fontWeight:800, fontFamily:"'Space Grotesk',sans-serif", lineHeight:1 }}, value),
    sub && React.createElement("div", { style:{ color:"#64748b", fontSize:11 }}, sub)
  );
}

function Modal({ onAdd, onClose, currentPeriod }) {
  const [form, setForm] = useState({ name:"", type:"Aesthetic (ความงาม)", package:"ไม่ระบุ", stage:"Prospect", value:"", prob:0, priority:"กลาง", month: currentPeriod });
  
  // ฟังก์ชันอัปเดตค่าฟอร์ม ถ้าเปลี่ยนประเภทคลินิก ให้ล้างค่าแพ็กเกจเป็น "ไม่ระบุ"
  const handleChange = (k, v) => {
    setForm(f => {
      const newForm = { ...f, [k]: v };
      if (k === 'type') newForm.package = "ไม่ระบุ";
      return newForm;
    });
  };

  const inputStyle = { background:"#1e293b", border:"1px solid #334155", borderRadius:8, padding:"8px 12px", color:"#f8fafc", fontSize:14, outline:"none", width:"100%" };

  return React.createElement("div", { style:{ position:"fixed", inset:0, background:"#000000cc", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }},
    React.createElement("div", { style:{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:20, padding:32, width:440, display:"flex", flexDirection:"column", gap:14 }},
      React.createElement("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" }},
        React.createElement("div", { style:{ color:"#f8fafc", fontWeight:700, fontSize:18, fontFamily:"'Space Grotesk',sans-serif" }}, "➕ เพิ่มคลินิกใหม่"),
        React.createElement("button", { onClick:onClose, style:{ background:"none", border:"none", color:"#64748b", fontSize:20, cursor:"pointer" }}, "✕")
      ),
      ...[
        { label:"ชื่อคลินิก", key:"name", type:"text" },
        { label:"มูลค่าที่เสนอ (บาท/ปี)", key:"value", type:"number" },
        { label:"โอกาสปิดดีล (%)", key:"prob", type:"number" },
      ].map(({ label, key, type }) =>
        React.createElement("div", { key, style:{ display:"flex", flexDirection:"column", gap:6 }},
          React.createElement("label", { style:{ color:"#94a3b8", fontSize:12 }}, label),
          React.createElement("input", { type, value:form[key], onChange:e=>handleChange(key,e.target.value), style:inputStyle })
        )
      ),
      ...[
        { label:"ประจำเดือน", key:"month", opts: PERIODS },
        { label:"ประเภทคลินิก", key:"type", opts:TYPES },
        { label:"แพ็กเกจโปรแกรมที่สนใจ", key:"package", opts: PACKAGE_MAP[form.type] || ["ไม่ระบุ"] },
        { label:"Stage ปัจจุบัน", key:"stage", opts:STAGES },
        { label:"Priority ความสำคัญ", key:"priority", opts:["สูง","กลาง","ต่ำ"] },
      ].map(({ label, key, opts }) =>
        React.createElement("div", { key, style:{ display:"flex", flexDirection:"column", gap:6 }},
          React.createElement("label", { style:{ color:"#94a3b8", fontSize:12 }}, label),
          React.createElement("select", { value:form[key], onChange:e=>handleChange(key,e.target.value), style:inputStyle },
            ...opts.map(o => React.createElement("option", { key:o }, o))
          )
        )
      ),
      React.createElement("button", {
        onClick:() => { onAdd({...form, id:Date.now(), value:Number(form.value)||0, prob:Number(form.prob)||0}); onClose(); },
        style:{ background:"linear-gradient(135deg,#6366f1,#8b5cf6)", border:"none", borderRadius:10, padding:12, color:"#fff", fontWeight:700, fontSize:15, cursor:"pointer", marginTop:4 }
      }, "บันทึกข้อมูล")
    )
  );
}

function App() {
  const [data, setData] = useState(() => {
    try { 
      const s = localStorage.getItem("pipeline"); 
      if(s) {
        let parsed = JSON.parse(s);
        return parsed.map(item => {
          // ดักข้อมูลเก่าให้แสดงผลชื่อให้ตรงกัน
          let newType = item.type;
          if(item.type === "Aesthetic") newType = "Aesthetic (ความงาม)";
          if(item.type === "General Clinic") newType = "General Clinic (คลินิกทั่วไป)";
          if(item.type === "Wellness") newType = "Wellness / กายภาพ";
          if(item.type === "Dental") newType = "Dental (ทำฟัน)";
          if(item.type === "Vet") newType = "Vet (รักษาสัตว์)";
          if(item.type === "Hair") newType = "Hair (ดูแลเส้นผม)";

          // ดักเอาคำว่าแบรนด์ออก เพื่อให้เหลือแค่ชื่อแพ็กเกจเพียวๆ ตามโครงสร้างใหม่
          let newPackage = item.package || "ไม่ระบุ";
          if(newPackage.includes(": ")) newPackage = newPackage.split(": ")[1];

          return {
            ...item,
            type: newType,
            month: item.month || "พฤษภาคม 2569",
            package: newPackage
          };
        });
      }
      return INITIAL_DATA; 
    } catch { return INITIAL_DATA; }
  });
  
  const [selectedPeriod, setSelectedPeriod] = useState("พฤษภาคม 2569");
  const [showModal, setShowModal] = useState(false);
  const [filterType, setFilterType] = useState("ทั้งหมด");
  const [filterStage, setFilterStage] = useState("ทั้งหมด");
  const [saved, setSaved] = useState(false);

  const save = () => {
    localStorage.setItem("pipeline", JSON.stringify(data));
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const activeData = data.filter(d => d.month === selectedPeriod);

  const filtered = activeData.filter(d =>
    (filterType === "ทั้งหมด" || d.type === filterType) &&
    (filterStage === "ทั้งหมด" || d.stage === filterStage)
  );

  const weightedPipeline = activeData.reduce((s,d) => s + (d.value * d.prob / 100), 0);
  const closedValue = activeData.filter(d => ["ปิดดีลแล้ว","รอเซ็นสัญญา"].includes(d.stage)).reduce((s,d) => s+d.value, 0);
  const conversionRate = activeData.length > 0 ? Math.round((activeData.filter(d=>d.stage==="ปิดดีลแล้ว").length / activeData.length)*100) : 0;

  const typeData = TYPES.map(t => ({ name:t, value:activeData.filter(d=>d.type===t).length })).filter(d=>d.value>0);
  const stageData = STAGES.map(s => ({ name:s, value:activeData.filter(d=>d.stage===s).length, fill:STAGE_COLORS[s] }));

  const addClinic = (c) => setData(p => [...p, c]);
  const updateStage = (id, stage) => setData(p => p.map(d => d.id===id ? {...d,stage} : d));
  const deleteClinic = (id) => { if(confirm("ลบคลินิกนี้ออกจากระบบ?")) setData(p => p.filter(d=>d.id!==id)); };

  const selectStyle = { background:"#1e293b", border:"1px solid #334155", borderRadius:8, padding:"6px 10px", color:"#94a3b8", fontSize:12, outline:"none" };

  return React.createElement("div", { style:{ background:"#020617", minHeight:"100vh", padding:"24px 28px" }},
    showModal && React.createElement(Modal, { onAdd:addClinic, onClose:()=>setShowModal(false), currentPeriod:selectedPeriod }),

    // Header
    React.createElement("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:28 }},
      React.createElement("div", null,
        React.createElement("div", { style:{ display:"flex", alignItems:"center", gap:10, marginBottom:4 }},
          React.createElement("div", { style:{ width:8, height:32, background:"linear-gradient(180deg,#6366f1,#e879f9)", borderRadius:4 }}),
          React.createElement("h1", { style:{ margin:0, fontSize:26, fontWeight:800, fontFamily:"'Space Grotesk',sans-serif", background:"linear-gradient(135deg,#e2e8f0,#94a3b8)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }},
            "Aoikumo Sales Dashboard"
          ),
          React.createElement("select", { 
            value: selectedPeriod, 
            onChange: e => setSelectedPeriod(e.target.value), 
            style: { marginLeft: 15, background:"#1e293b", border:"1px solid #6366f1", borderRadius:8, padding:"6px 12px", color:"#f8fafc", fontSize:16, outline:"none", cursor:"pointer", fontWeight:700 }
          },
            ...PERIODS.map(p => React.createElement("option", { key:p }, p))
          )
        ),
        React.createElement("div", { style:{ color:"#475569", fontSize:13, marginLeft:18 }}, "ข้อมูลบันทึกในเครื่อง (สลับเดือนเพื่อดูข้อมูลแยกกันได้)")
      ),
      React.createElement("div", { style:{ display:"flex", gap:10 }},
        React.createElement("button", { onClick:save, style:{ background: saved ? "#10b981" : "#1e293b", border:"1px solid #334155", borderRadius:12, padding:"10px 18px", color:"#f8fafc", fontWeight:700, fontSize:14, cursor:"pointer" }},
          saved ? "✅ บันทึกแล้ว" : "💾 บันทึก"
        ),
        React.createElement("button", { onClick:()=>setShowModal(true), style:{ background:"linear-gradient(135deg,#6366f1,#8b5cf6)", border:"none", borderRadius:12, padding:"10px 20px", color:"#fff", fontWeight:700, fontSize:14, cursor:"pointer", boxShadow:"0 4px 20px #6366f144" }},
          "➕ เพิ่มคลินิก"
        )
      )
    ),

    // KPI Cards
    React.createElement("div", { style:{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:16, marginBottom:24 }},
      React.createElement(KPICard, { label:"Lead ทั้งหมด", value:activeData.length, sub:`Filtered: ${filtered.length} เจ้า`, color:"#6366f1", icon:"🏥" }),
      React.createElement(KPICard, { label:"Pipeline (Weighted)", value:`฿${Math.round(weightedPipeline/1000)}K`, sub:"คำนวณจากโอกาสปิด", color:"#e879f9", icon:"💰" }),
      React.createElement(KPICard, { label:"มูลค่าที่ปิดได้", value:`฿${Math.round(closedValue/1000)}K`, sub:"รวมรอเซ็นสัญญา", color:"#10b981", icon:"✅" }),
      React.createElement(KPICard, { label:"Conversion Rate", value:`${conversionRate}%`, sub:"ปิดได้ / ทั้งหมด", color:"#f59e0b", icon:"📈" })
    ),

    // Charts
    React.createElement("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:16, marginBottom:24 }},

      // Pie
      React.createElement("div", { style:{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:16, padding:20 }},
        React.createElement("div", { style:{ fontWeight:700, fontSize:14, marginBottom:16, color:"#e2e8f0" }}, "🏷️ สัดส่วนประเภทคลินิก"),
        React.createElement(ResponsiveContainer, { width:"100%", height:180 },
          React.createElement(PieChart, null,
            React.createElement(Pie, { data:typeData, cx:"50%", cy:"50%", innerRadius:45, outerRadius:75, paddingAngle:3, dataKey:"value" },
              ...typeData.map(entry => React.createElement(Cell, { key:entry.name, fill:TYPE_COLORS[entry.name]||"#94a3b8" }))
            ),
            React.createElement(Tooltip, { contentStyle:{ background:"#1e293b", border:"1px solid #334155", borderRadius:8, color:"#f8fafc", fontSize:12 }})
          )
        ),
        React.createElement("div", { style:{ display:"flex", flexWrap:"wrap", gap:8, marginTop:8 }},
          ...typeData.map(d => React.createElement("div", { key:d.name, style:{ display:"flex", alignItems:"center", gap:5, fontSize:11, color:"#94a3b8" }},
            React.createElement("div", { style:{ width:8, height:8,
